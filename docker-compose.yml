name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiran
      POSTGRES_PASSWORD: exam123
      POSTGRES_DB: endexam_2400031871
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiran -d endexam_2400031871"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  crud-service:
    image: kiran31871/docker-end-exam-2400031871:latest
    build:
      context: ./CrudServiceProject
      dockerfile: DockerFile
    container_name: crud-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/endexam_2400031871
      SPRING_DATASOURCE_USERNAME: kiran
      SPRING_DATASOURCE_PASSWORD: exam123
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
